<!DOCTYPE html>
<html>
    <head>
        <title>Lorem ipsum</title>
    </head>
    <body>
        <div class="main">
            <div class="head">
                <p>Lorem ipsum</p>
            </div>
            <div class="paragraph-count">
                <div class="paragraph-text">
                    <p>Paragraphs</p>
                </div>
                <div class ="paragraph-input">
                    <input type="number" class="paragraph-num" value="1">
                    <input type="range" class="paragraph-range" min="1" max="100" value="1">
                </div>
            </div>
            <div class ="word-paragraph">
                <div class = "word-text">
                    <p>Word per Paragraph</p>
                </div>
                <div class ="word-input">
                    <input type="number" class="word-num" value="1">
                    <input type="range" class="word-range" min="1" max="1000" value="1">
                </div>
            </div>
            <div id ="output"></div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
